<!DOCTYPE html>
<html>

<head>
    <title>Sou Cliente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

    <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="customer-wrapper">

    <div class="customer-header">
            
        <button
            class="back-button"
            onclick="window.location.href='index.html'">

            ← Início

        </button>

        <h1 class="logo">

            Agenda <span>Pro</span>

        </h1>

        <p class="subtitle">

            Agende seu horário em poucos segundos.

        </p>

    </div>


    <div class="customer-container">


        <div class="form-card">

            <h2>👤 Cadastro</h2>

            <p class="section-description">
                Informe seus dados para criar seu cadastro.
            </p>

            <p>Nome</p>
        
            <input id="name" class="input_field">
        
            <p>Telefone</p>
            <input id="phone" class="input_field">
            
            <button
            type="button"
            id="register-client-button"
            class="register-button">

            Cadastrar

            </button>

        </div>

        
        <div class="form-card">

            <h2>📅 Agendamento</h2>

            <p class="section-description">
                Escolha a data e o horário disponível
            </p>

            <p>Clientes</p>

            <select id="client-select" class="input_field">
            </select>

            <p>Data</p>

            <input
            type="date"
            id="date"
            class="input_field">

            <p>Horário</p>

            <select
            id="time"
            class="input_field">
            </select>

            <button

            type="button"
            id="create-appointment-button"
            class="register-button">

            Criar agendamento

            </button>


        </div>


    </div>
</div>

    <div id="toast"></div>
    <script src="toast.js"></script>
    <script src="clients.js"></script>
    <script src="appointments.js"></script>

</body>

</html>
