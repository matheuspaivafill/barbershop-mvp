<!DOCTYPE html>
<html lang="pt-BR">

<head>
    
    <meta charset="UTF-8">

    <title>Administração</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

</head>


<body>

<div class="admin-container">

    <div class="dashboard-header">

        <div>

            <h1 class="logo">
                Agenda <span>Pro</span>
            </h1>

            <p class="subtitle">
                Painel Administrativo
            </p>

            <p class="dashboard-description">
                Gerencie clientes, acompanhe agendamentos e mantenha sua agenda organizada.
            </p>

            <div class="share-link-box" style="margin-top: 16px; padding: 12px 16px; background: #f7f7f7; border-radius: 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <span style="font-size: 14px; color: #555;">Link para seus clientes agendarem:</span>
                <input id="share-link-input" type="text" readonly class="input_field" style="flex: 1; min-width: 220px; margin: 0; font-size: 13px;">
                <button id="copy-link-btn" class="btn-secondary" type="button">Copiar link</button>
            </div>

        </div>

        <button id="logout-btn" class="btn-secondary" type="button">Sair</button>

    </div>

    <div class="dashboard">

        <div class="summary-card">

            <div class="summary-icon">
                👥
            </div>

            <h3>Clientes</h3>

            <strong id="total-clients">
                0
            </strong>

            <span>
                cadastrados
            </span>

        </div>

        <div class="summary-card">

            <div class="summary-icon">
                📅
            </div>

            <h3>Agendamentos</h3>

            <strong id="total-appointments">
                0
            </strong>

            <span>
                marcados
            </span>

            </div>

    </div>

    <hr class="section-divider">

        <div class="section-header">

            <h2 id="clients-title">
                Clientes
            </h2>

            <button
                class="action-button"
                onclick="window.location.href='customer.html'">

                + Novo Cliente

            </button>

        </div>

        <div class="search-box">

        <input
            type="text"
            id="search-client"
            placeholder="🔍 Pesquisar cliente...">

    </div>

    <div id="clients-list"></div>



    <div class="section-header">

        <h2 id="appointments-title">
            Agendamentos
        </h2>

        <button
            class="action-button"
            onclick="window.location.href='customer.html'">

            + Novo Agendamento

        </button>

    </div>

    <div class="search-box">

        <input
            type="text"
            id="search-appointment"
            placeholder="🔍 Pesquisar agendamento...">

    </div>

    <div id="appointments-list"></div>

        <button
            class="register-button"
            onclick="window.location.href='index.html'">

            ← Voltar

        </button>

    </div>

        <script src="config.js?v=2"></script>
        <div id="toast"></div>
        <script src="toast.js?v=2"></script>
        <script src="admin.js?v=2"></script>
        <div id="toast"></div>

</body>

</html>
