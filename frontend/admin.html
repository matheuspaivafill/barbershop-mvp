<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Administração</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

</head>


<body>

<div class="admin-container">

    <div class="dashboard-header">

        <div>

            <h1 class="logo">
                Agenda <span>Pro</span>
            </h1>

            <p class="subtitle">
                Painel Administrativo
            </p>

            <p class="dashboard-description">
                Gerencie clientes, acompanhe agendamentos e mantenha sua agenda organizada.
            </p>

        </div>

    </div>

    <div class="dashboard">

        <div class="summary-card">

            <div class="summary-icon">
                👥
            </div>

            <h3>Clientes</h3>

            <strong id="total-clients">
                0
            </strong>

            <span>
                cadastrados
            </span>

        </div>

        <div class="summary-card">

            <div class="summary-icon">
                📅
            </div>

            <h3>Agendamentos</h3>

            <strong id="total-appointments">
                0
            </strong>

            <span>
                marcados
            </span>

            </div>

    </div>

    <hr class="section-divider">

    <h2 id="clients-title">
        Clientes
    </h2>

    <div class="search-box">

        <input
            type="text"
            id="search-client"
            placeholder="🔍 Pesquisar cliente...">

    </div>

    <div id="clients-list"></div>

    <h2 id="appointments-title">
        Agendamentos
    </h2>

    <div class="search-box">

        <input
            type="text"
            id="search-appointment"
            placeholder="🔍 Pesquisar agendamento...">

    </div>

    <div id="appointments-list"></div>

    <button
        class="register-button"
        onclick="window.location.href='index.html'">

        ← Voltar

    </button>

</div>

<script src="admin.js"></script>

</body>

</html>
